<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanning</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topbar">

📦 Warehouse Scanner

</header>

<main class="container">

<div class="card">

<h1>กำลังสแกนสินค้า</h1>

<p id="product"></p>

<p id="target"></p>

<hr>

<h2 id="progress">

0 / 0

</h2>

<div class="input-group">

<label>Scan Barcode</label>

<input
type="text"
id="barcode"
placeholder="ยิงบาร์โค้ดที่นี่"
autocomplete="off"
>

</div>

<div id="status">

พร้อมสแกน

</div>

<hr>

<h3>รายการล่าสุด</h3>

<div id="history">

ยังไม่มีข้อมูล

</div>

<br>

<button id="finishButton">

จบการสแกน

</button>

</div>

</main>

<script src="js/scanner.js"></script>

</body>

</html>
