<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Warehouse Scanner</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">

        📦 Warehouse Scanner

    </div>

</header>

<main class="container">

<div class="card scan-card">

<h1>กำลังสแกนสินค้า</h1>

<div class="info-box">

    <div class="row">

        <span>สินค้า</span>

        <strong id="product">-</strong>

    </div>

    <div class="row">

        <span>จำนวนที่ต้องสแกน</span>

        <strong id="target">0</strong>

    </div>

</div>

<div class="progress-area">

<div class="progress-text">

<span id="progress">0 / 0</span>

<span id="remaining">เหลือ 0</span>

</div>

<div class="progress">

<div id="progressBar"></div>

</div>

</div>

<div class="scan-box">

<label>สแกนบาร์โค้ด</label>

<input
type="text"
id="barcode"
autocomplete="off"
placeholder="ยิงบาร์โค้ดที่นี่">

</div>

<div id="status" class="status success">

พร้อมสแกน

</div>

<h3>

รายการล่าสุด

</h3>

<div id="lastBarcode">

-

</div>

<h3>

ประวัติการสแกน

</h3>

<div class="history">

<table>

<thead>

<tr>

<th>#</th>

<th>Barcode</th>

<th>เวลา</th>

</tr>

</thead>

<tbody id="historyTable">

</tbody>

</table>

</div>

<div class="button-group">

<button id="finishButton">

จบการสแกน

</button>

<button
onclick="location.href='index.html'">

กลับหน้าหลัก

</button>

</div>

</div>

</main>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/history.js"></script>
<script src="js/barcode.js"></script>
<script src="js/duplicate.js"></script>
<script src="js/speech.js"></script>
<script src="js/ui.js"></script>
<script src="js/scanner.js"></script>

</body>

</html>
