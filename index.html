<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Warehouse Barcode Scanner</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        📦 Warehouse Scanner
    </div>

</header>

<main class="container">

    <div class="card">

        <h1>Warehouse Barcode Scanner</h1>

        <p class="subtitle">
            ระบบสแกนบาร์โค้ดสำหรับตรวจนับสินค้า
        </p>

        <div class="input-group">

            <label>รหัสสินค้า</label>

            <input
                type="text"
                id="productCode"
                placeholder="เช่น ABC12345">

        </div>

        <div class="input-group">

            <label>จำนวนที่ต้องนับ</label>

            <input
                type="number"
                id="targetQty"
                placeholder="เช่น 250">

        </div>

        <button id="startButton">

            เริ่มสแกนสินค้า

        </button>

    </div>

</main>

<footer>

Warehouse Scanner Version 2.0

</footer>

<script src="js/app.js"></script>

</body>
</html>
